[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmdex"
version = "0.33.0"
description = "Local semantic search for project files"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime",
    "tokenizers",
    "tree-sitter==0.25.2",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-rust",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-c-sharp",
    "tree-sitter-dart",
    "numpy",
]

[tool.ruff.lint]
# Ruff's implicit defaults widened in 0.16 and broke CI on unchanged code; state them here.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["llm_index"]

[project.scripts]
llmdex = "llm_index.cli:main"
llmdex-index = "llm_index.index:main"
llmdex-query = "llm_index.query:main"
llmdex-server = "llm_index.server:main"
