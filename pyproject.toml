[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmdex"
version = "0.29.0"
description = "Local semantic search for project files"
requires-python = ">=3.10"
dependencies = [
    "llama-index-core",
    "llama-index-readers-file",
    "llama-index-embeddings-huggingface",
    # Pin: language-pack 1.x bundles its own tree-sitter binding (returns
    # builtins.Language) which is incompatible with the standalone tree_sitter
    # Parser used in ast_chunker. 0.13.x delegates to the real tree_sitter.
    "tree-sitter-language-pack==0.13.0",
    "tree-sitter==0.25.2",
    "rank-bm25",
]

[tool.setuptools.packages.find]
include = ["llm_index"]

[project.scripts]
llmdex = "llm_index.cli:main"
llmdex-index = "llm_index.index:main"
llmdex-query = "llm_index.query:main"
llmdex-server = "llm_index.server:main"
