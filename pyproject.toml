[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmdex"
version = "0.25.0"
description = "Local semantic search for project files"
requires-python = ">=3.10"
dependencies = [
    "llama-index-core",
    "llama-index-readers-file",
    "llama-index-embeddings-huggingface",
    "tree-sitter-language-pack",
    "rank-bm25",
]

[tool.setuptools.packages.find]
include = ["llm_index"]

[project.scripts]
llmdex = "llm_index.cli:main"
llmdex-index = "llm_index.index:main"
llmdex-query = "llm_index.query:main"
llmdex-server = "llm_index.server:main"
